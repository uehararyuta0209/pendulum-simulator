<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>振り子シミュレーター</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>振り子シミュレーター</h1>
  <img id="graph" src="/graph" alt="振り子グラフ">
  <form id="simForm" action="/graph" method="get">
  <label>振り子の長さ (m):
    <input type="number" name="length" value="1.0" step="0.1">
  </label>
  <label>初期角度 (°):
    <input type="number" name="angle" value="30.0" step="0.1">
  </label>
  <label>減衰係数 (b):
    <input type="number" name="b" value="0.5" step="0.1">
  </label>
  <button type="submit">シミュレート</button>
</form>
<script>
document.getElementById('simForm').addEventListener('submit', function(e) {
    e.preventDefault()  // ページ遷移を止める
    
    const length = document.querySelector('[name="length"]').value
    const angle  = document.querySelector('[name="angle"]').value
    const b      = document.querySelector('[name="b"]').value
    
    // img の src を書き換える
    document.getElementById('graph').src = 
        `/graph?length=${length}&angle=${angle}&b=${b}`
})
</script>
</body>
</html>
