<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>振り子シミュレーター</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>振り子シミュレーター</h1>
  <img src="/graph" alt="振り子グラフ">
  <form action="/graph" method="get">
  <label>振り子の長さ (m):
    <input type="number" name="length" value="1.0" step="0.1">
  </label>
  <label>初期角度 (°):
    <input type="number" name="angle" value="30.0" step="0.1">
  </label>
  <button type="submit">シミュレート</button>
</form>
</body>
</html>
